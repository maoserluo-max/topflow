version: '3.8'

services:
  # 后端API服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: topflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./topflow.db:/app/topflow.db
    environment:
      - DATABASE_URL=sqlite:///./data/topflow.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production-2024}
      - CORS_ORIGINS=["http://43.160.238.9","http://localhost:3000"]
    networks:
      - topflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端Web服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: topflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - topflow-network

networks:
  topflow-network:
    driver: bridge

volumes:
  data:
    driver: local